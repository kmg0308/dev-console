[workspace]
members = [
    "crates/runtime-atlas-cli",
    "crates/runtime-atlas-core",
    "crates/runtime-atlas-supervisor",
    "crates/token-meter-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
libc = "=0.2.189"
plist = "1.10.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sys-locale = "0.3.2"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.10.1"
tempfile = "3.27.0"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = "=0.61.2"

[profile.release]
lto = true
strip = true
