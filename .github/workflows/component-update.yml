name: Update component revision
on:
  repository_dispatch:
    types: [component-released]
permissions:
  contents: read
concurrency:
  group: dev-console-component-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Validate dispatch and update one pin
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          REVISION: ${{ github.event.client_payload.revision }}
          VERSION: ${{ github.event.client_payload.version }}
          TAG: ${{ github.event.client_payload.tag }}
        run: ./scripts/update-component.sh "$COMPONENT" "$REVISION" "$VERSION" "$TAG"
      - run: ./scripts/verify.sh
      - name: Detect dependency change
        id: dependency
        run: |
          if git diff --quiet -- Package.swift Package.resolved; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create update PR
        if: steps.dependency.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEV_CONSOLE_AUTOMATION_TOKEN }}
          COMPONENT: ${{ github.event.client_payload.component }}
          REVISION: ${{ github.event.client_payload.revision }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          test -n "$GH_TOKEN"
          gh auth setup-git
          BRANCH="automation/${COMPONENT}-${REVISION:0:12}"
          git checkout -B "$BRANCH"
          git config user.name "dev-console-automation[bot]"
          git config user.email "dev-console-automation[bot]@users.noreply.github.com"
          git add Package.swift Package.resolved
          git commit -m "Update ${COMPONENT} to ${VERSION}"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          PR_NUMBER="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [[ -z "$PR_NUMBER" ]]; then
            gh pr create --base main --head "$BRANCH" --title "Update ${COMPONENT} to ${VERSION}" --body "Automated component release update."
            PR_NUMBER="$(gh pr view "$BRANCH" --json number --jq .number)"
          fi
          gh pr merge "$PR_NUMBER" --auto --squash
          for _ in {1..60}; do
            [[ "$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '.statusCheckRollup | length')" -gt 0 ]] && break
            sleep 2
          done
          test "$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '.statusCheckRollup | length')" -gt 0
          gh pr checks "$PR_NUMBER" --watch --required
          for _ in {1..300}; do
            [[ "$(gh pr view "$PR_NUMBER" --json state --jq .state)" == MERGED ]] && break
            sleep 2
          done
          test "$(gh pr view "$PR_NUMBER" --json state --jq .state)" = MERGED
