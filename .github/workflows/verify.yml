name: Desktop checks and unsigned bundles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          # This validates a Windows Server runner, not Windows 10 22H2 runtime behavior.
          - name: Windows Server 2022 compile checks
            os: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  bundles:
    name: ${{ matrix.app.id }} (${{ matrix.name }})
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app:
          - id: token-meter
            product: TokenMeter
            binary: TokenMeter
            identifier: local.tokenmeter.app
            version: 0.2.0
            runtime: false
          - id: runtime-atlas
            product: RuntimeAtlas
            binary: RuntimeAtlas
            identifier: com.kmg0308.runtimeatlas
            version: 0.2.0
            runtime: true
          - id: dev-console
            product: DevConsole
            binary: DevConsole
            identifier: com.kmg0308.devconsole
            version: 0.2.0
            runtime: true
        platform: [macos, windows]
        include:
          - platform: macos
            name: macOS universal
            os: macos-14
            target: universal-apple-darwin
            bundles: app,dmg
            bundle_dir: dmg
            bundle_suffix: universal.dmg
          # This validates an x64 NSIS package on Windows Server, not Windows 10 22H2.
          - platform: windows
            name: Windows Server 2022 x64 package smoke
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            bundle_dir: nsis
            bundle_suffix: x64-setup.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Windows Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build unsigned bundle
        run: npm run tauri -- build --ci --no-sign --config apps/${{ matrix.app.id }}/tauri.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify macOS DMG install and startup
        if: matrix.platform == 'macos'
        run: >-
          bash scripts/verify-macos-bundle.sh
          target/${{ matrix.target }}/release/bundle/dmg/${{ matrix.app.product }}_${{ matrix.app.version }}_universal.dmg
          '${{ matrix.app.product }}'
          '${{ matrix.app.binary }}'
          '${{ matrix.app.identifier }}'
          '${{ matrix.app.version }}'
          '${{ matrix.app.runtime }}'
      - name: Test RuntimeAtlas macOS package contract
        if: matrix.app.id == 'runtime-atlas' && matrix.platform == 'macos'
        run: npm run test:runtime-atlas:macos-package -- target/${{ matrix.target }}/release/bundle/macos/RuntimeAtlas.app
      - name: Smoke Windows bundle and startup on Server 2022
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/verify-windows-bundle.ps1
          -ProductName '${{ matrix.app.product }}'
          -MainBinaryName '${{ matrix.app.binary }}'
          -BundleIdentifier '${{ matrix.app.identifier }}'
          -Version '${{ matrix.app.version }}'
          -RuntimeFeature '${{ matrix.app.runtime }}'
          -AllowWindowsServerSmoke
      - name: Preserve verified unsigned bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.app.id }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/${{ matrix.bundle_dir }}/${{ matrix.app.product }}_${{ matrix.app.version }}_${{ matrix.bundle_suffix }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify:
    if: ${{ always() }}
    needs: [checks, bundles]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.bundles.result }}" = success
