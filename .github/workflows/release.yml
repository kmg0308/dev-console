name: Build and Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: dev-console-release-main
  cancel-in-progress: true
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify packaged app
        run: VERSION="0.1.${GITHUB_RUN_NUMBER}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/verify.sh
      - name: Publish release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          git fetch origin main
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          ASSETS=(
            dist/DevConsole.zip
            dist/DevConsole.pkg
            "dist/DevConsole-$VERSION.zip"
            "dist/DevConsole-$VERSION.pkg"
            dist/manifest.json
          )
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${ASSETS[@]}" --clobber
          else
            gh release create "v$VERSION" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "DevConsole $VERSION" \
              --generate-notes \
              --latest
          fi
